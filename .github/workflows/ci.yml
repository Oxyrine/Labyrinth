name: Tessera Fast CI

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]

jobs:
  fast-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
      - name: Dependency vulnerability check
        run: pip-audit || true
      - name: Validate contract schemas and artifacts
        run: python contract/validate.py --export-schemas
      - name: Run fast test suite
        run: pytest -q -m "not slow"
      - name: Verify world JSON determinism
        run: |
          python run.py world --regime A --json-only
          git diff --exit-code -- 'data/out/**/*.json'
      - name: Verify evaluation report determinism
        run: |
          python run.py report
          git diff --exit-code eval/report.md eval/report.json
      - name: Security and boundary guards
        run: python run.py guards
