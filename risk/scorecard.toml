# Labyrinth Buyer & Receivables Risk Scorecard (schema_version = 1)
# Illustrative prototype policy, not validated commercial lending prices.

base_points = 100

[grade_bands]
A = 85
B = 70
C = 55
D = 40
E = 0

[pricing.A]
advance_rate_bps = 9000
annual_rate_bps = 1000

[pricing.B]
advance_rate_bps = 8500
annual_rate_bps = 1200

[pricing.C]
advance_rate_bps = 7500
annual_rate_bps = 1400

[pricing.D]
advance_rate_bps = 6000
annual_rate_bps = 1700

[pricing.E]
advance_rate_bps = 0
annual_rate_bps = 0

# Feature deduction/bonus bands evaluated against base_points = 100.
# A clean goods invoice with normal/good buyer history (60d tenor, standard concentration)
# lands in Grade B (70..84 points -> 85% advance rate, 12% p.a. annual rate).

