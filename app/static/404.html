<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Labyrinth</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314100C'/%3E%3Cpath d='M8 10h16v3H17.5v11h-3V13H8z' fill='%23ffffff'/%3E%3Ccircle cx='23' cy='21' r='3.5' fill='%23a9ba87'/%3E%3C/svg%3E">
  <style>
    :root { --bg:#14100C; --ink:#EFE7D8; --muted:#9A8F7E; --brand:#C9A227; --line:#2C241D; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:"Instrument Sans","Segoe UI",system-ui,sans-serif; padding:16px; }
    main { max-width:480px; }
    .eyebrow { font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--muted); }
    h1 { font:400 48px/1.15 "Instrument Serif",Georgia,serif; margin:8px 0 12px; }
    h1 span { color:var(--brand); }
    p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
    a { display:inline-block; color:var(--brand); border:1px solid rgba(201,162,39,.4); text-decoration:none; padding:12px 22px; border-radius:4px; font-weight:600; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    a:hover { background:rgba(201,162,39,.14); border-color:var(--brand); }
    a:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">404 · Not found</div>
    <h1>Lost in the maze<span>.</span></h1>
    <p>That page does not exist. Every request, check and audit record lives in the workspace.</p>
    <a href="/">Back to the workspace</a>
  </main>
</body>
</html>
